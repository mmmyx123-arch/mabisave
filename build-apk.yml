name: ZIP 자동 압축 해제 및 APK 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: ZIP 압축 자동 해제
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          archive = workspace / 'MabiSave_AutoMacro_V3_2_source.zip'
          if not archive.is_file():
              raise SystemExit('저장소 최상위에 MabiSave_AutoMacro_V3_2_source.zip 파일을 올려주세요.')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mabisave-source'
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              if sum(info.file_size for info in z.infolist()) > 200 * 1024 * 1024:
                  raise SystemExit('압축 해제 크기가 200MB를 초과합니다.')
              for info in z.infolist():
                  target = (destination / info.filename).resolve()
                  if not target.is_relative_to(destination.resolve()):
                      raise SystemExit('잘못된 압축 파일 경로입니다.')
              z.extractall(destination)
          projects = [f.parent for f in destination.rglob('settings.gradle*')
                      if f.name in ('settings.gradle', 'settings.gradle.kts')]
          if len(projects) != 1:
              raise SystemExit('ZIP 안에서 Android 프로젝트 하나를 찾을 수 없습니다.')
          project = projects[0]
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PROJECT_DIR={project}\n')
          print('압축 해제 완료:', project)
          PY

      - name: Java 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v3

      - name: Android 35 설치
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon :app:assembleDebug

      - name: APK 다운로드 파일 저장
        uses: actions/upload-artifact@v4
        with:
          name: MabiSave-V3.2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
