name: Deploy Dunbarton Omok V2.4
on:
  push:
    paths: ['dunbarton_omok_online_v2_4_existing_do.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack V2.4
        run: |
          rm -rf .omok_unpack
          mkdir .omok_unpack
          unzip -o dunbarton_omok_online_v2_4_existing_do.zip -d .omok_unpack
          test -f .omok_unpack/package.json
          test -f .omok_unpack/wrangler.jsonc
          test -f .omok_unpack/src/worker.js
          rm -rf omok-cloudflare
          mkdir -p omok-cloudflare/src
          cp .omok_unpack/package.json omok-cloudflare/package.json
          cp .omok_unpack/wrangler.jsonc omok-cloudflare/wrangler.jsonc
          cp .omok_unpack/src/worker.js omok-cloudflare/src/worker.js
          rm -rf .omok_unpack
      - name: Commit V2.4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omok-cloudflare
          git diff --cached --quiet && exit 0
          git commit -m "Deploy Dunbarton Omok V2.4 existing Durable Object"
          git push
