name: Deploy Dunbarton Omok V2.2

on:
  push:
    paths:
      - 'dunbarton_omok_online_v2_2_faces_fixed.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack V2.2
        run: |
          rm -rf .omok_unpack
          mkdir -p .omok_unpack
          unzip -o dunbarton_omok_online_v2_2_faces_fixed.zip -d .omok_unpack

          test -f .omok_unpack/package.json
          test -f .omok_unpack/wrangler.jsonc
          test -f .omok_unpack/src/worker.js

          rm -rf omok-cloudflare
          mkdir -p omok-cloudflare/src
          cp .omok_unpack/package.json omok-cloudflare/package.json
          cp .omok_unpack/wrangler.jsonc omok-cloudflare/wrangler.jsonc
          cp .omok_unpack/src/worker.js omok-cloudflare/src/worker.js
          rm -rf .omok_unpack

      - name: Commit V2.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omok-cloudflare
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Deploy Dunbarton Omok V2.2 fixed"
          git push
