name: Validate Dunbarton Omok
on:
  push:
    branches: [main]
    paths: ['omok-cloudflare/**', '.github/workflows/unzip-omok.yml']
  pull_request:
    paths: ['omok-cloudflare/**', '.github/workflows/unzip-omok.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omok-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: omok-cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
