name: Build MabiSave V3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract V3 project
        run: |
          rm -rf project
          mkdir project
          unzip -q MabiSave_AutoMacro_V3.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V3 APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: MabiSave-AutoMacro-V3-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
